
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'SF Pro Display';
        src: url('/fonts/SF Pro Display Font Family/San Francisco Pro Display/SF-Pro-Display-Ultralight.otf') format('opentype');
        font-weight: 100;
      }
      @font-face {
        font-family: 'SF Pro Display';
        src: url('/fonts/SF Pro Display Font Family/San Francisco Pro Display/SF-Pro-Display-Thin.otf') format('opentype');
        font-weight: 200;
      }
      @font-face {
        font-family: 'SF Pro Display';
        src: url('/fonts/SF Pro Display Font Family/San Francisco Pro Display/SF-Pro-Display-Light.otf') format('opentype');
        font-weight: 300;
      }
      @font-face {
        font-family: 'SF Pro Display';
        src: url('/fonts/SF Pro Display Font Family/San Francisco Pro Display/SF-Pro-Display-Regular.otf') format('opentype');
        font-weight: 400;
      }
      @font-face {
        font-family: 'SF Pro Display';
        src: url('/fonts/SF Pro Display Font Family/San Francisco Pro Display/SF-Pro-Display-Medium.otf') format('opentype');
        font-weight: 500;
      }
      @font-face {
        font-family: 'SF Pro Display';
        src: url('/fonts/SF Pro Display Font Family/San Francisco Pro Display/SF-Pro-Display-Semibold.otf') format('opentype');
        font-weight: 600;
      }
      @font-face {
        font-family: 'SF Pro Display';
        src: url('/fonts/SF Pro Display Font Family/San Francisco Pro Display/SF-Pro-Display-Bold.otf') format('opentype');
        font-weight: 700;
      }
      @font-face {
        font-family: 'SF Pro Display';
        src: url('/fonts/SF Pro Display Font Family/San Francisco Pro Display/SF-Pro-Display-Heavy.otf') format('opentype');
        font-weight: 800;
      }
      @font-face {
        font-family: 'SF Pro Display';
        src: url('/fonts/SF Pro Display Font Family/San Francisco Pro Display/SF-Pro-Display-Black.otf') format('opentype');
        font-weight: 900;
      }
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      html {
        scroll-behavior: smooth;
        margin: 0 !important;
        padding: 0 !important;
      }
      body {
        font-family: 'SF Pro Display', sans-serif;
        background-color: #1C1C1C;
        color: #ECE8DF;
        margin: 0 !important;
        padding: 0 !important;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'SF Pro Display', sans-serif;
        font-weight: 500;
      }
      p {
        font-family: 'SF Pro Display', sans-serif;
        font-weight: 500;
      }
      /* Noise and grid overlay removed */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #1C1C1C;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #444;
      }
      .font-huge {
        font-size: clamp(3rem, 11vw, 12rem);
        line-height: 0.8;
        letter-spacing: -0.06em;
      }
      .selection-custom::selection {
        background-color: #fff;
        color: #000;
      }

      /* ShinyText Effect */
      .shiny-text {
        color: #b5b5b5a4;
        background: linear-gradient(
          120deg,
          rgba(255, 255, 255, 0) 40%,
          rgba(255, 255, 255, 0.8) 50%,
          rgba(255, 255, 255, 0) 60%
        );
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        display: inline-block;
        animation: shine 5s linear infinite;
      }
      .shiny-text.disabled {
        animation: none;
        background: none;
        color: inherit;
      }
      @keyframes shine {
        0% { background-position: 100%; }
        100% { background-position: -100%; }
      }
    </style>

}
</script>
</head>

</body>
</html>
