      /* Studio Grid Background */
      .grid-overlay {
        position: fixed;
        inset: 0;
        background-image: 
          linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        pointer-events: none;

      .no-scrollbar {

      .font-huge {

        letter-spacing: -0.06em;
      }
      .selection-custom::selection {
        background-color: #fff;

      }

      /* ShinyText Effect */
      .shiny-text {
        color: #b5b5b5a4;
        background: linear-gradient(
          120deg,
          rgba(255, 255, 255, 0) 40%,
          rgba(255, 255, 255, 0.8) 50%,
          rgba(255, 255, 255, 0) 60%
        );
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        display: inline-block;
        animation: shine 5s linear infinite;
      }
      .shiny-text.disabled {
        animation: none;
        background: none;
        color: inherit;
      }
      @keyframes shine {
        0% { background-position: 100%; }
        100% { background-position: -100%; }
      }

  <body class="noise selection-custom">

    <!-- Hello Loader - Shows before React loads -->
    <div id="hello-loader" style="position: fixed; inset: 0; z-index: 9999; background: #1C1C1C; display: flex; justify-content: center; align-items: center;">
      <span id="hello-text" style="font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 80px; font-weight: 300; color: #ECE8DF; letter-spacing: -0.02em;">Hello</span>
    </div>
    <script>
      (function() {
        const helloText = document.getElementById('hello-text');
        const isMobile = window.innerWidth < 768;
        helloText.style.fontSize = isMobile ? '55px' : '80px';
        const words = [
          "Hello",       // English
          "હેલો",         // Gujarati
          "नमस्ते",       // Hindi
          "வணக்கம்",      // Tamil
          "హలో",          // Telugu
          "ಹಲೋ",          // Kannada
          "হ্যালো"         // Bengali
        ];
        
        let index = 0;
        const helloLoader = document.getElementById('hello-loader');
        
        function nextWord() {
          helloText.textContent = words[index];
          index = (index + 1) % words.length;
        }
        
        nextWord();
        const wordInterval = setInterval(nextWord, 175);
        
        // Fade out after cycling through all words twice
        setTimeout(function() {
          clearInterval(wordInterval);
          helloLoader.style.transition = 'opacity 0.8s cubic-bezier(0.76, 0, 0.24, 1)';
          helloLoader.style.opacity = '0';
          setTimeout(function() {
            helloLoader.style.display = 'none';
          }, 800);
        }, words.length * 175 * 2);
      })();
    </script>
